name: Audit

# Auditoría automática: velocidad (Lighthouse), botones/flujos (Playwright),
# type-check y dependencias inseguras. Corre en cada push a main y a mano.
# Secretos necesarios (GitHub → Settings → Secrets → Actions):
#   APP_URL      https://www.onyxtradinglive.com
#   CRON_SECRET  el mismo valor que en Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Type-check (TypeScript)
        run: |
          set +e
          npx tsc --noEmit 2> tsc.txt
          COUNT=$(grep -E "error TS" tsc.txt | grep -v node_modules | wc -l | tr -d ' ')
          echo "TS_ERRORS=${COUNT:-0}" >> "$GITHUB_ENV"
          echo "Errores TypeScript: ${COUNT:-0}"

      - name: Dependencias inseguras (npm audit)
        run: |
          set +e
          npm audit --omit=dev --json > audit.json 2>/dev/null
          VULNS=$(node -e "try{const a=require('./audit.json');console.log(a.metadata?.vulnerabilities?.total||0)}catch{console.log(0)}")
          echo "VULNS=${VULNS:-0}" >> "$GITHUB_ENV"
          echo "Vulnerabilidades: ${VULNS:-0}"

      - name: Botones y flujos (Playwright)
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set +e
          npm install -D @playwright/test@1.47.2 --no-audit --no-fund
          npx playwright install --with-deps chromium
          APP_URL="$APP_URL" npx playwright test || true

      - name: Velocidad y SEO (Lighthouse · mediana de 3)
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set +e
          # Lighthouse en CI es MUY variable (servidores compartidos): una sola
          # medición salta ±20-30 puntos. Corremos 3 veces y nos quedamos con la
          # MEDIANA (la del medio), que es mucho más estable y realista.
          for i in 1 2 3; do
            npx --yes lighthouse@12 "$APP_URL" \
              --only-categories=performance,accessibility,seo,best-practices \
              --output=json --output-path="lh$i.json" --quiet \
              --chrome-flags="--headless=new --no-sandbox" || true
          done
          # Elige el archivo con el rendimiento MEDIANO y lo deja como lh.json.
          node -e '
            const fs=require("fs");
            const perf=f=>{try{return Math.round((JSON.parse(fs.readFileSync(f,"utf8")).categories.performance.score||0)*100)}catch{return -1}};
            const runs=[1,2,3].map(i=>({f:`lh${i}.json`,p:perf(`lh${i}.json`)})).filter(r=>r.p>=0);
            if(!runs.length){console.log("Lighthouse: sin corridas válidas");process.exit(0);}
            runs.sort((a,b)=>a.p-b.p);
            const mid=runs[Math.floor(runs.length/2)];
            fs.copyFileSync(mid.f,"lh.json");
            console.log("Lighthouse performance por corrida:",runs.map(r=>r.p).join(", "),"→ mediana",mid.p);
          ' || true

      - name: Enviar informe al panel
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          node scripts/audit-report.mjs || true
          if [ -f payload.json ]; then
            curl -s -X POST "$APP_URL/api/admin/audit" \
              -H "x-cron-secret: $CRON_SECRET" \
              -H "content-type: application/json" \
              --data-binary @payload.json || true
          fi

      - name: Presupuesto de rendimiento (solo avisa)
        # El rendimiento NO bloquea el push: Lighthouse en CI es demasiado variable
        # para ser una puerta dura. Solo avisa; el número (ya en mediana) se ve en
        # el panel para seguir la tendencia. Las puertas duras quedan para cosas
        # deterministas (TypeScript, pruebas), no para una métrica ruidosa.
        run: |
          PERF=$(node -e "try{console.log(require('./payload.json').lighthouse?.performance ?? 100)}catch{console.log(100)}")
          echo "Rendimiento (mediana): $PERF"
          if [ "$PERF" -lt 55 ]; then
            echo "::warning::Rendimiento $PERF bajo (objetivo 80). Revisa qué pesa en el landing, pero no bloquea el deploy."
          elif [ "$PERF" -lt 80 ]; then
            echo "::warning::Rendimiento $PERF por debajo del objetivo (80). Conviene optimizar."
          fi
