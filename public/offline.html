<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onyx · Sin conexión</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f1a;color:#e6ebf2;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .ring{width:64px;height:64px;border-radius:50%;border:6px solid #7c8cff;border-right-color:transparent;margin-bottom:20px;}
  h1{font-size:20px;font-weight:600;margin:0 0 8px;}
  p{color:#9aa6bd;font-size:14px;max-width:300px;line-height:1.6;margin:0 0 20px;}
  button{background:#7c8cff;color:#0b0f1a;border:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="ring"></div>
    <h1>Sin conexión / Offline</h1>
    <p>No hay internet ahora mismo. Onyx se abrirá de nuevo cuando vuelva la conexión.<br><br>There is no internet right now. Onyx will load again once you are back online.</p>
    <button onclick="location.reload()">Reintentar / Retry</button>
  </div>
</body>
</html>
