<svg viewBox="0 0 820 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="La clave API se crea en Onyx, se pega en el EA y queda atada a tu número de cuenta">
  <rect width="820" height="260" rx="18" fill="#0e121b"/>
  <rect x="1" y="1" width="818" height="258" rx="18" fill="none" stroke="#232a3d"/>
  <text x="40" y="46" fill="#e8ecf4" font-family="Arial" font-size="18" font-weight="bold">La clave API: una por cuenta</text>
  <!-- Onyx genera -->
  <g transform="translate(50,80)">
    <rect width="220" height="130" rx="12" fill="#151a26" stroke="#2b3350"/>
    <text x="20" y="30" fill="#8b93a7" font-family="Arial" font-size="12">En Onyx › Cuentas</text>
    <rect x="20" y="48" width="180" height="28" rx="6" fill="#0e121b" stroke="#7c8cff"/>
    <text x="32" y="66" fill="#7cc4f0" font-family="monospace" font-size="12">ONX-9F3K-2P7Q</text>
    <rect x="20" y="88" width="90" height="26" rx="6" fill="#7c8cff"/><text x="65" y="105" text-anchor="middle" fill="#0e121b" font-family="Arial" font-size="12" font-weight="bold">Copiar</text>
  </g>
  <g stroke="#7c8cff" stroke-width="2.5" fill="none"><path d="M278 145 H336" marker-end="url(#k1)"/></g>
  <defs><marker id="k1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#7c8cff"/></marker></defs>
  <text x="307" y="130" text-anchor="middle" fill="#7c8cff" font-family="Arial" font-size="11">pegar</text>
  <!-- EA -->
  <g transform="translate(350,80)">
    <rect width="200" height="130" rx="12" fill="#151a26" stroke="#2b3350"/>
    <text x="20" y="30" fill="#8b93a7" font-family="Arial" font-size="12">En el EA</text>
    <rect x="20" y="48" width="160" height="24" rx="6" fill="#0e121b" stroke="#2b3350"/>
    <text x="30" y="65" fill="#c9d0e6" font-family="monospace" font-size="11">ApiKey = ONX-…</text>
    <text x="20" y="100" fill="#6f7891" font-family="Arial" font-size="11">primera sincronización</text>
  </g>
  <g stroke="#34e2a0" stroke-width="2.5" fill="none"><path d="M558 145 H616" marker-end="url(#k2)"/></g>
  <defs><marker id="k2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#34e2a0"/></marker></defs>
  <!-- atada -->
  <g transform="translate(628,80)">
    <rect width="150" height="130" rx="12" fill="#151a26" stroke="#1d9e75"/>
    <g transform="translate(48,28)"><circle cx="14" cy="14" r="12" fill="none" stroke="#34e2a0" stroke-width="4"/><rect x="10" y="24" width="8" height="16" rx="2" fill="#34e2a0"/></g>
    <text x="75" y="92" text-anchor="middle" fill="#34e2a0" font-family="Arial" font-size="12" font-weight="bold">Atada a #12345</text>
    <text x="75" y="112" text-anchor="middle" fill="#6f7891" font-family="Arial" font-size="10">no acepta otra cuenta</text>
  </g>
</svg>
