<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Instala Onyx como app en tu móvil para recibir avisos y abrirla como una aplicación">
  <rect width="820" height="300" rx="18" fill="#0e121b"/>
  <rect x="1" y="1" width="818" height="298" rx="18" fill="none" stroke="#232a3d"/>
  <text x="40" y="46" fill="#e8ecf4" font-family="Arial" font-size="18" font-weight="bold">Instala Onyx como app</text>
  <text x="40" y="70" fill="#8b93a7" font-family="Arial" font-size="13.5">se abre como una aplicación y recibe avisos push</text>
  <!-- teléfono -->
  <g transform="translate(90,92)">
    <rect width="120" height="180" rx="18" fill="#151a26" stroke="#2b3350"/>
    <rect x="14" y="18" width="92" height="120" rx="8" fill="#0e121b"/>
    <circle cx="60" cy="60" r="22" fill="#161b2e" stroke="#7c8cff"/>
    <path d="M60 46 l5 10 h11 l-9 7 l3 11 l-10 -7 l-10 7 l3 -11 l-9 -7 h11 z" fill="#7c8cff"/>
    <rect x="30" y="150" width="60" height="8" rx="4" fill="#2b3350"/>
  </g>
  <!-- pasos -->
  <g transform="translate(250,96)" font-family="Arial">
    <g>
      <circle cx="16" cy="16" r="15" fill="#7c8cff"/><text x="16" y="21" text-anchor="middle" fill="#0e121b" font-size="14" font-weight="bold">1</text>
      <text x="44" y="21" fill="#c9d0e6" font-size="14">Abre Onyx en tu navegador</text>
    </g>
    <g transform="translate(0,58)">
      <circle cx="16" cy="16" r="15" fill="#7c8cff"/><text x="16" y="21" text-anchor="middle" fill="#0e121b" font-size="14" font-weight="bold">2</text>
      <text x="44" y="21" fill="#c9d0e6" font-size="14">Pulsa "Instalar app"</text>
    </g>
    <g transform="translate(0,116)">
      <circle cx="16" cy="16" r="15" fill="#7c8cff"/><text x="16" y="21" text-anchor="middle" fill="#0e121b" font-size="14" font-weight="bold">3</text>
      <text x="44" y="21" fill="#c9d0e6" font-size="14">Activa las notificaciones</text>
    </g>
    <g transform="translate(0,168)">
      <rect x="0" y="0" width="150" height="34" rx="9" fill="#7c8cff"/><text x="75" y="22" text-anchor="middle" fill="#0e121b" font-size="13" font-weight="bold">Instalar app</text>
    </g>
  </g>
</svg>
