  <rect x="0.5" y="0.5" width="559" height="169" rx="12" fill="none" stroke="#232a3d"/>
  <!-- barra con botón AlgoTrading -->
  <rect x="20" y="24" width="520" height="34" rx="8" fill="#1b2233"/>
  <rect x="32" y="31" width="120" height="20" rx="6" fill="#12331f" stroke="#1d9e75"/>
  <circle cx="46" cy="41" r="5" fill="#34e2a0"/>
