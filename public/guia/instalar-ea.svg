<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Instalar el EA de Onyx en MetaTrader: copiar el archivo, compilar, arrastrar al gráfico, pegar la clave y activar AlgoTrading">
  <rect width="820" height="320" rx="18" fill="#0e121b"/>
  <rect x="1" y="1" width="818" height="318" rx="18" fill="none" stroke="#232a3d"/>
  <text x="40" y="46" fill="#e8ecf4" font-family="Arial" font-size="18" font-weight="bold">Instalar el EA en MetaTrader</text>
  <!-- ventana MT -->
  <g transform="translate(40,74)">
    <rect width="470" height="210" rx="12" fill="#151a26" stroke="#2b3350"/>
    <rect width="470" height="30" rx="12" fill="#1b2233"/>
    <circle cx="20" cy="15" r="5" fill="#e24b4a"/><circle cx="38" cy="15" r="5" fill="#ffc04d"/><circle cx="56" cy="15" r="5" fill="#1d9e75"/>
    <text x="230" y="20" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="12">MetaTrader — gráfico</text>
    <!-- panel Onyx dentro -->
    <rect x="300" y="46" width="150" height="146" rx="8" fill="#0e121b" stroke="#2b3350"/>
    <path d="M375 66 l6 12 h13 l-11 9 l4 13 l-12 -8 l-12 8 l4 -13 l-11 -9 h13 z" fill="#7c8cff"/>
    <rect x="316" y="108" width="118" height="8" rx="4" fill="#2b3350"/>
    <rect x="316" y="124" width="90" height="8" rx="4" fill="#222a3e"/>
    <rect x="316" y="150" width="118" height="24" rx="6" fill="#12331f" stroke="#1d9e75"/>
    <text x="375" y="166" text-anchor="middle" fill="#34e2a0" font-family="Arial" font-size="11">Conectado</text>
    <!-- líneas de velas -->
    <g stroke="#2b3350" stroke-width="2"><path d="M40 150 l30 -20 l30 15 l30 -30 l30 25 l30 -15"/></g>
    <g fill="#1d9e75"><rect x="50" y="120" width="8" height="30"/><rect x="110" y="110" width="8" height="35"/><rect x="170" y="130" width="8" height="25"/></g>
  </g>
  <!-- pasos -->
  <g transform="translate(540,84)" font-family="Arial">
    <g><circle cx="14" cy="14" r="13" fill="#7c8cff"/><text x="14" y="19" text-anchor="middle" fill="#0e121b" font-size="12" font-weight="bold">1</text><text x="38" y="19" fill="#c9d0e6" font-size="13">Copia el archivo a Experts</text></g>
    <g transform="translate(0,42)"><circle cx="14" cy="14" r="13" fill="#7c8cff"/><text x="14" y="19" text-anchor="middle" fill="#0e121b" font-size="12" font-weight="bold">2</text><text x="38" y="19" fill="#c9d0e6" font-size="13">Compila (F7)</text></g>
    <g transform="translate(0,84)"><circle cx="14" cy="14" r="13" fill="#7c8cff"/><text x="14" y="19" text-anchor="middle" fill="#0e121b" font-size="12" font-weight="bold">3</text><text x="38" y="19" fill="#c9d0e6" font-size="13">Arrástralo al gráfico</text></g>
    <g transform="translate(0,126)"><circle cx="14" cy="14" r="13" fill="#7c8cff"/><text x="14" y="19" text-anchor="middle" fill="#0e121b" font-size="12" font-weight="bold">4</text><text x="38" y="19" fill="#c9d0e6" font-size="13">Pega tu clave API</text></g>
    <g transform="translate(0,168)"><circle cx="14" cy="14" r="13" fill="#1d9e75"/><text x="14" y="19" text-anchor="middle" fill="#0e121b" font-size="12" font-weight="bold">5</text><text x="38" y="19" fill="#34e2a0" font-size="13">Activa AlgoTrading</text></g>
  </g>
</svg>
