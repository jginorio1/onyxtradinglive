<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Crear tu academia como mentor: configura, añade cursos y clases, y publica para tus alumnos">
  <rect width="820" height="300" rx="18" fill="#0e121b"/>
  <rect x="1" y="1" width="818" height="298" rx="18" fill="none" stroke="#232a3d"/>
  <text x="40" y="46" fill="#e8ecf4" font-family="Arial" font-size="18" font-weight="bold">Crea tu academia como mentor</text>
  <!-- tres tarjetas de paso -->
  <g transform="translate(40,80)">
    <rect width="230" height="180" rx="12" fill="#151a26" stroke="#2b3350"/>
    <circle cx="34" cy="40" r="16" fill="#7c8cff"/><text x="34" y="45" text-anchor="middle" fill="#0e121b" font-family="Arial" font-size="14" font-weight="bold">1</text>
    <text x="60" y="45" fill="#c9d0e6" font-family="Arial" font-size="14" font-weight="bold">Configura</text>
    <rect x="24" y="70" width="182" height="12" rx="6" fill="#2b3350"/>
    <rect x="24" y="92" width="140" height="12" rx="6" fill="#222a3e"/>
    <rect x="24" y="120" width="80" height="40" rx="8" fill="#1b2233"/><text x="64" y="145" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="12">portada</text>
    <rect x="116" y="120" width="90" height="40" rx="8" fill="#1b2233"/><text x="161" y="145" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="12">precio</text>
  </g>
  <g transform="translate(295,80)">
    <rect width="230" height="180" rx="12" fill="#151a26" stroke="#2b3350"/>
    <circle cx="34" cy="40" r="16" fill="#7c8cff"/><text x="34" y="45" text-anchor="middle" fill="#0e121b" font-family="Arial" font-size="14" font-weight="bold">2</text>
    <text x="60" y="45" fill="#c9d0e6" font-family="Arial" font-size="14" font-weight="bold">Cursos y clases</text>
    <g font-family="Arial" font-size="12" fill="#8b93a7">
      <rect x="24" y="66" width="182" height="24" rx="6" fill="#1b2233"/><text x="34" y="82">▶ Lección 1</text>
      <rect x="24" y="98" width="182" height="24" rx="6" fill="#1b2233"/><text x="34" y="114">▶ Lección 2</text>
      <rect x="24" y="130" width="182" height="24" rx="6" fill="#1b2233"/><text x="34" y="146">🎥 Clase en vivo</text>
    </g>
  </g>
  <g transform="translate(550,80)">
    <rect width="230" height="180" rx="12" fill="#151a26" stroke="#1d9e75"/>
    <circle cx="34" cy="40" r="16" fill="#1d9e75"/><text x="34" y="45" text-anchor="middle" fill="#0e121b" font-family="Arial" font-size="14" font-weight="bold">3</text>
    <text x="60" y="45" fill="#c9d0e6" font-family="Arial" font-size="14" font-weight="bold">Publica</text>
    <g><circle cx="60" cy="96" r="18" fill="#2a2350"/><circle cx="92" cy="96" r="18" fill="#12331f"/><circle cx="124" cy="96" r="18" fill="#3a2a1a"/></g>
    <text x="24" y="146" fill="#34e2a0" font-family="Arial" font-size="13">Tus alumnos entran</text>
    <rect x="24" y="156" width="120" height="12" rx="6" fill="#1d9e75"/>
  </g>
</svg>
