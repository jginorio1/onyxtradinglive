<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Conectar cTrader: añade el cBot de Onyx, pega tu clave y pulsa Play">
  <rect width="820" height="300" rx="18" fill="#0e121b"/>
  <rect x="1" y="1" width="818" height="298" rx="18" fill="none" stroke="#232a3d"/>
  <text x="40" y="46" fill="#e8ecf4" font-family="Arial" font-size="18" font-weight="bold">Conectar cTrader con el cBot de Onyx</text>
  <!-- ventana cTrader -->
  <g transform="translate(40,74)">
    <rect width="430" height="188" rx="12" fill="#151a26" stroke="#2b3350"/>
    <rect width="430" height="30" rx="12" fill="#1b2233"/>
    <text x="215" y="20" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="12">cTrader — Automate</text>
    <rect x="20" y="46" width="180" height="122" rx="8" fill="#0e121b" stroke="#2b3350"/>
    <text x="34" y="72" fill="#c9d0e6" font-family="Arial" font-size="12">OnyxGuardian</text>
    <rect x="34" y="86" width="150" height="9" rx="4" fill="#2b3350"/>
    <rect x="34" y="104" width="120" height="9" rx="4" fill="#222a3e"/>
    <rect x="34" y="130" width="150" height="24" rx="6" fill="#12331f" stroke="#1d9e75"/>
    <text x="109" y="146" text-anchor="middle" fill="#34e2a0" font-family="Arial" font-size="11">cBot en marcha</text>
    <!-- botón play -->
    <circle cx="320" cy="107" r="34" fill="#161b2e" stroke="#1d9e75" stroke-width="2"/>
    <path d="M310 91 l24 16 l-24 16 z" fill="#34e2a0"/>
    <text x="320" y="162" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="12">Play</text>
  </g>
  <!-- pasos -->
  <g transform="translate(500,84)" font-family="Arial">
    <g><circle cx="14" cy="14" r="13" fill="#7c8cff"/><text x="14" y="19" text-anchor="middle" fill="#0e121b" font-size="12" font-weight="bold">1</text><text x="38" y="19" fill="#c9d0e6" font-size="13">Añade el cBot en Automate</text></g>
    <g transform="translate(0,48)"><circle cx="14" cy="14" r="13" fill="#7c8cff"/><text x="14" y="19" text-anchor="middle" fill="#0e121b" font-size="12" font-weight="bold">2</text><text x="38" y="19" fill="#c9d0e6" font-size="13">Pega tu clave API</text></g>
    <g transform="translate(0,96)"><circle cx="14" cy="14" r="13" fill="#1d9e75"/><text x="14" y="19" text-anchor="middle" fill="#0e121b" font-size="12" font-weight="bold">3</text><text x="38" y="19" fill="#34e2a0" font-size="13">Pulsa Play</text></g>
  </g>
</svg>
