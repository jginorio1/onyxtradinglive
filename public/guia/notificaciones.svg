<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Onyx te avisa por tres vías: la campana del panel, notificaciones push en el móvil y Telegram">
  <rect width="820" height="320" rx="18" fill="#0e121b"/>
  <rect x="1" y="1" width="818" height="318" rx="18" fill="none" stroke="#232a3d"/>
  <text x="410" y="46" text-anchor="middle" fill="#e8ecf4" font-family="Arial" font-size="18" font-weight="bold">Tres formas de recibir avisos</text>
  <text x="410" y="70" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="13.5">tú eliges cuáles enciendes, para cada tipo</text>
  <!-- Campana -->
  <g transform="translate(70,110)">
    <rect width="200" height="150" rx="14" fill="#151a26" stroke="#2b3350"/>
    <circle cx="100" cy="58" r="30" fill="#161b2e" stroke="#7c8cff" stroke-width="1.5"/>
    <path d="M100 40 c-9 0 -14 6 -14 15 v10 l-5 6 h38 l-5 -6 v-10 c0 -9 -5 -15 -14 -15 z" fill="#7c8cff"/>
    <circle cx="100" cy="82" r="4" fill="#7c8cff"/>
    <circle cx="118" cy="40" r="7" fill="#e24b4a"/>
    <text x="100" y="118" text-anchor="middle" fill="#c9d0e6" font-family="Arial" font-size="14" font-weight="bold">Campana</text>
    <text x="100" y="138" text-anchor="middle" fill="#6f7891" font-family="Arial" font-size="12">dentro del panel</text>
  </g>
  <!-- Push -->
  <g transform="translate(310,110)">
    <rect width="200" height="150" rx="14" fill="#151a26" stroke="#2b3350"/>
    <rect x="78" y="26" width="44" height="66" rx="8" fill="#161b2e" stroke="#34e2a0" stroke-width="1.5"/>
    <rect x="84" y="34" width="32" height="10" rx="3" fill="#1d9e75"/>
    <rect x="84" y="48" width="24" height="6" rx="3" fill="#2b3350"/>
    <text x="100" y="118" text-anchor="middle" fill="#c9d0e6" font-family="Arial" font-size="14" font-weight="bold">Push</text>
    <text x="100" y="138" text-anchor="middle" fill="#6f7891" font-family="Arial" font-size="12">en tu móvil</text>
  </g>
  <!-- Telegram -->
  <g transform="translate(550,110)">
    <rect width="200" height="150" rx="14" fill="#151a26" stroke="#2b3350"/>
    <circle cx="100" cy="56" r="28" fill="#2aa8e8"/>
    <path d="M84 56 l32 -12 l-6 30 l-9 -8 l-6 6 l-1 -12 z" fill="#fff"/>
    <text x="100" y="118" text-anchor="middle" fill="#c9d0e6" font-family="Arial" font-size="14" font-weight="bold">Telegram</text>
    <text x="100" y="138" text-anchor="middle" fill="#6f7891" font-family="Arial" font-size="12">al vincular tu cuenta</text>
  </g>
</svg>
