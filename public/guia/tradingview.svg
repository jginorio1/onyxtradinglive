<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Una alerta de TradingView llega a Onyx por webhook y ejecuta la operación en tu cuenta">
  <rect width="820" height="300" rx="18" fill="#0e121b"/>
  <rect x="1" y="1" width="818" height="298" rx="18" fill="none" stroke="#232a3d"/>
  <text x="40" y="46" fill="#e8ecf4" font-family="Arial" font-size="18" font-weight="bold">Señales de TradingView a tu cuenta</text>
  <!-- TradingView -->
  <g transform="translate(50,90)">
    <rect width="200" height="150" rx="12" fill="#151a26" stroke="#2b3350"/>
    <text x="100" y="30" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="13">TradingView</text>
    <g stroke="#2aa8e8" stroke-width="2.5" fill="none"><path d="M22 110 l26 -18 l26 12 l26 -28 l26 20 l26 -12 l26 8"/></g>
    <rect x="24" y="118" width="152" height="22" rx="6" fill="#12233a" stroke="#2aa8e8"/>
    <text x="100" y="133" text-anchor="middle" fill="#7cc4f0" font-family="Arial" font-size="11">Alerta: comprar</text>
  </g>
  <g stroke="#7c8cff" stroke-width="2.5" fill="none"><path d="M258 165 H326" marker-end="url(#tv)"/></g>
  <defs><marker id="tv" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#7c8cff"/></marker>
  <marker id="tv2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#34e2a0"/></marker></defs>
  <text x="292" y="150" text-anchor="middle" fill="#7c8cff" font-family="Arial" font-size="11">webhook</text>
  <!-- Onyx -->
  <g transform="translate(345,120)">
    <circle r="42" fill="#161b2e" stroke="#7c8cff" stroke-width="1.5"/>
    <path d="M0 -22 l8 16 h17 l-14 11 l6 18 l-17 -11 l-17 11 l6 -18 l-14 -11 h17 z" fill="#7c8cff"/>
    <text x="0" y="66" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="12">Onyx recibe y filtra</text>
  </g>
  <g stroke="#34e2a0" stroke-width="2.5" fill="none"><path d="M432 165 H500" marker-end="url(#tv2)"/></g>
  <text x="466" y="150" text-anchor="middle" fill="#34e2a0" font-family="Arial" font-size="11">ejecuta</text>
  <!-- cuenta -->
  <g transform="translate(516,90)">
    <rect width="250" height="150" rx="12" fill="#151a26" stroke="#1d9e75"/>
    <text x="20" y="34" fill="#8b93a7" font-family="Arial" font-size="13">Tu cuenta</text>
    <text x="20" y="72" fill="#c9d0e6" font-family="Arial" font-size="13">EURUSD · compra</text>
    <text x="230" y="72" text-anchor="end" fill="#34e2a0" font-family="Arial" font-size="13" font-weight="bold">0.20 lotes</text>
    <line x1="20" y1="88" x2="230" y2="88" stroke="#2b3350"/>
    <text x="20" y="116" fill="#8b93a7" font-family="Arial" font-size="12">con tu Guardian y tu SL aplicados</text>
    <rect x="20" y="126" width="140" height="12" rx="6" fill="#1d9e75"/>
  </g>
</svg>
