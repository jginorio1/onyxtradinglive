<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tu plan, tu check-in diario, tu adherencia y el mapa de 30 días">
  <rect width="820" height="340" rx="18" fill="#0e121b"/>
  <rect x="1" y="1" width="818" height="338" rx="18" fill="none" stroke="#232a3d"/>
  <text x="40" y="48" fill="#e8ecf4" font-family="Arial" font-size="18" font-weight="bold">Tu disciplina, medida cada día</text>
  <!-- Anillo adherencia -->
  <g>
    <circle cx="130" cy="180" r="52" fill="none" stroke="#222a3e" stroke-width="12"/>
    <circle cx="130" cy="180" r="52" fill="none" stroke="#34e2a0" stroke-width="12" stroke-linecap="round" stroke-dasharray="235 327" transform="rotate(-90 130 180)"/>
    <text x="130" y="176" text-anchor="middle" fill="#e8ecf4" font-family="Arial" font-size="26" font-weight="bold">72%</text>
    <text x="130" y="198" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="12">adherencia</text>
    <text x="130" y="256" text-anchor="middle" fill="#6f7891" font-family="Arial" font-size="12.5">hábitos + disciplina real</text>
  </g>
  <!-- Check-in -->
  <g>
    <rect x="240" y="96" width="230" height="176" rx="12" fill="#151a26" stroke="#2b3350"/>
    <text x="260" y="124" fill="#c9d0e6" font-family="Arial" font-size="14" font-weight="bold">Check-in de hoy</text>
    <g font-family="Arial" font-size="12.5">
      <circle cx="268" cy="150" r="8" fill="#34e2a0"/><path d="M264 150 l3 3 l5 -6" stroke="#0e121b" stroke-width="2" fill="none"/>
      <text x="286" y="154" fill="#c9d0e6">Revisé el calendario</text>
      <circle cx="268" cy="180" r="8" fill="#34e2a0"/><path d="M264 180 l3 3 l5 -6" stroke="#0e121b" stroke-width="2" fill="none"/>
      <text x="286" y="184" fill="#c9d0e6">Definí mi riesgo</text>
      <circle cx="268" cy="210" r="8" fill="none" stroke="#454e68" stroke-width="1.5"/>
      <text x="286" y="214" fill="#8b93a7">Cerré en mi límite</text>
      <circle cx="268" cy="240" r="8" fill="#34e2a0"/><path d="M264 240 l3 3 l5 -6" stroke="#0e121b" stroke-width="2" fill="none"/>
      <text x="286" y="244" fill="#c9d0e6">Registré mis operaciones</text>
    </g>
  </g>
  <!-- Mapa 30 días -->
  <g>
    <rect x="500" y="96" width="286" height="176" rx="12" fill="#151a26" stroke="#2b3350"/>
    <text x="520" y="124" fill="#c9d0e6" font-family="Arial" font-size="14" font-weight="bold">Cumplimiento · 30 días</text>
    <g>
      <!-- 30 celdas 10x3 -->
      <g id="cells"></g>
      <!-- fila 1 -->
      <rect x="520" y="140" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="546" y="140" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="572" y="140" width="20" height="20" rx="4" fill="#ffc04d"/><rect x="598" y="140" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="624" y="140" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="650" y="140" width="20" height="20" rx="4" fill="#e24b4a"/><rect x="676" y="140" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="702" y="140" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="728" y="140" width="20" height="20" rx="4" fill="#ffc04d"/><rect x="754" y="140" width="20" height="20" rx="4" fill="#1d9e75"/>
      <rect x="520" y="166" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="546" y="166" width="20" height="20" rx="4" fill="#ffc04d"/><rect x="572" y="166" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="598" y="166" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="624" y="166" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="650" y="166" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="676" y="166" width="20" height="20" rx="4" fill="#ffc04d"/><rect x="702" y="166" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="728" y="166" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="754" y="166" width="20" height="20" rx="4" fill="#1d9e75"/>
      <rect x="520" y="192" width="20" height="20" rx="4" fill="#e24b4a"/><rect x="546" y="192" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="572" y="192" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="598" y="192" width="20" height="20" rx="4" fill="#ffc04d"/><rect x="624" y="192" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="650" y="192" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="676" y="192" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="702" y="192" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="728" y="192" width="20" height="20" rx="4" fill="#1d9e75"/><rect x="754" y="192" width="20" height="20" rx="4" fill="#ffc04d"/>
    </g>
    <g font-family="Arial" font-size="11.5">
      <rect x="520" y="236" width="11" height="11" rx="3" fill="#1d9e75"/><text x="537" y="246" fill="#8b93a7">Cumplido</text>
      <rect x="612" y="236" width="11" height="11" rx="3" fill="#ffc04d"/><text x="629" y="246" fill="#8b93a7">Flojo</text>
      <rect x="686" y="236" width="11" height="11" rx="3" fill="#e24b4a"/><text x="703" y="246" fill="#8b93a7">Regla rota</text>
    </g>
  </g>
</svg>
