<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tres pasos para conectar tu cobro: conectar Stripe, completar datos, y quedar habilitado para cobrar">
  <rect width="820" height="300" rx="18" fill="#0e121b"/>
  <rect x="1" y="1" width="818" height="298" rx="18" fill="none" stroke="#232a3d"/>
  <text x="40" y="46" fill="#e8ecf4" font-family="Arial" font-size="18" font-weight="bold">Conectar tu cobro (una sola vez)</text>

  <g transform="translate(40,80)">
    <rect width="230" height="180" rx="12" fill="#151a26" stroke="#2b3350"/>
    <circle cx="34" cy="40" r="16" fill="#7c8cff"/><text x="34" y="45" text-anchor="middle" fill="#0e121b" font-family="Arial" font-size="14" font-weight="bold">1</text>
    <text x="60" y="45" fill="#c9d0e6" font-family="Arial" font-size="14" font-weight="bold">Conectar Stripe</text>
    <rect x="24" y="70" width="182" height="40" rx="8" fill="#635bff"/><text x="115" y="95" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">Conectar con Stripe</text>
    <text x="24" y="140" fill="#8b93a7" font-family="Arial" font-size="12">Crea tu cuenta</text>
    <text x="24" y="158" fill="#8b93a7" font-family="Arial" font-size="12">Express en segundos.</text>
  </g>

  <g transform="translate(295,80)">
    <rect width="230" height="180" rx="12" fill="#151a26" stroke="#2b3350"/>
    <circle cx="34" cy="40" r="16" fill="#7c8cff"/><text x="34" y="45" text-anchor="middle" fill="#0e121b" font-family="Arial" font-size="14" font-weight="bold">2</text>
    <text x="60" y="45" fill="#c9d0e6" font-family="Arial" font-size="14" font-weight="bold">Tus datos</text>
    <g font-family="Arial" font-size="12" fill="#8b93a7">
      <rect x="24" y="66" width="182" height="22" rx="6" fill="#1b2233"/><text x="34" y="81">Nombre / negocio</text>
      <rect x="24" y="94" width="182" height="22" rx="6" fill="#1b2233"/><text x="34" y="109">País e identidad</text>
      <rect x="24" y="122" width="182" height="22" rx="6" fill="#1b2233"/><text x="34" y="137">Cuenta bancaria</text>
    </g>
    <text x="24" y="164" fill="#8b93a7" font-family="Arial" font-size="11">Lo pide Stripe, no Onyx.</text>
  </g>

  <g transform="translate(550,80)">
    <rect width="230" height="180" rx="12" fill="#151a26" stroke="#1d9e75"/>
    <circle cx="34" cy="40" r="16" fill="#1d9e75"/><text x="34" y="45" text-anchor="middle" fill="#0e121b" font-family="Arial" font-size="14" font-weight="bold">3</text>
    <text x="60" y="45" fill="#c9d0e6" font-family="Arial" font-size="14" font-weight="bold">Listo para cobrar</text>
    <circle cx="115" cy="104" r="34" fill="#0f2a1c" stroke="#1d9e75"/>
    <path d="M100 104 l10 12 l22 -26" fill="none" stroke="#34e2a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="115" y="160" text-anchor="middle" fill="#34e2a0" font-family="Arial" font-size="12" font-weight="bold">charges_enabled ✓</text>
  </g>
</svg>
