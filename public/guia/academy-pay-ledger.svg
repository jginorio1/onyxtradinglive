<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama tecnico: Stripe envia eventos al webhook, que registra cada comision de forma idempotente en el libro onyx_commissions">
  <rect width="820" height="340" rx="18" fill="#0e121b"/>
  <rect x="1" y="1" width="818" height="338" rx="18" fill="none" stroke="#232a3d"/>
  <text x="40" y="44" fill="#e8ecf4" font-family="Arial" font-size="18" font-weight="bold">Cómo se anota cada comisión (técnico)</text>

  <!-- Stripe events -->
  <g transform="translate(40,72)">
    <rect width="220" height="230" rx="12" fill="#151a26" stroke="#635bff"/>
    <text x="16" y="30" fill="#c9d0e6" font-family="Arial" font-size="13" font-weight="bold">Eventos de Stripe</text>
    <g font-family="Arial" font-size="11" fill="#a9b2c9">
      <rect x="14" y="46" width="192" height="26" rx="6" fill="#1b2233"/><text x="24" y="63">checkout.session.completed</text>
      <rect x="14" y="78" width="192" height="26" rx="6" fill="#1b2233"/><text x="24" y="95">invoice.paid (renovaciones)</text>
      <rect x="14" y="110" width="192" height="26" rx="6" fill="#1b2233"/><text x="24" y="127">charge.refunded</text>
      <rect x="14" y="142" width="192" height="26" rx="6" fill="#1b2233"/><text x="24" y="159">subscription.updated</text>
      <rect x="14" y="174" width="192" height="26" rx="6" fill="#1b2233"/><text x="24" y="191">subscription.deleted</text>
      <rect x="14" y="206" width="192" height="14" rx="6" fill="#101725"/><text x="24" y="217" fill="#6c7590">firma: ACADEMY_WEBHOOK_SECRET</text>
    </g>
  </g>
  <g><path d="M266 188 L308 188" stroke="#635bff" stroke-width="3"/><path d="M308 182 L320 188 L308 194 Z" fill="#635bff"/></g>

  <!-- Webhook -->
  <g transform="translate(326,100)">
    <rect width="180" height="170" rx="12" fill="#151a26" stroke="#7c8cff"/>
    <text x="16" y="30" fill="#c9d0e6" font-family="Arial" font-size="13" font-weight="bold">Webhook academia</text>
    <g font-family="Arial" font-size="11" fill="#a9b2c9">
      <text x="16" y="60">feeForMentor()</text>
      <text x="16" y="82" fill="#8b93a7">override → plan → global</text>
      <rect x="16" y="96" width="148" height="1" fill="#2b3350"/>
      <text x="16" y="120">fee = bruto × %</text>
      <text x="16" y="144" fill="#34e2a0">idempotente por ref</text>
    </g>
  </g>
  <g><path d="M512 188 L554 188" stroke="#7c8cff" stroke-width="3"/><path d="M554 182 L566 188 L554 194 Z" fill="#7c8cff"/></g>

  <!-- Ledger -->
  <g transform="translate(572,72)">
    <rect width="208" height="230" rx="12" fill="#151a26" stroke="#1d9e75"/>
    <text x="16" y="30" fill="#c9d0e6" font-family="Arial" font-size="13" font-weight="bold">Libro onyx_commissions</text>
    <g font-family="Arial" font-size="11">
      <rect x="14" y="44" width="180" height="30" rx="6" fill="#0f2a1c"/><text x="24" y="63" fill="#7fe3b6">earned · bruto + fee</text>
      <rect x="14" y="80" width="180" height="30" rx="6" fill="#0f2a1c"/><text x="24" y="99" fill="#7fe3b6">earned · renovación</text>
      <rect x="14" y="116" width="180" height="30" rx="6" fill="#241014"/><text x="24" y="135" fill="#ff9aa6">reversed · reembolso</text>
    </g>
    <rect x="14" y="158" width="180" height="1" fill="#2b3350"/>
    <text x="16" y="182" fill="#8b93a7" font-family="Arial" font-size="11">Tus ingresos =</text>
    <text x="16" y="202" fill="#34e2a0" font-family="Arial" font-size="12" font-weight="bold">bruto − fee (sin reversed)</text>
    <text x="16" y="222" fill="#6c7590" font-family="Arial" font-size="10">único (mentor_id, stripe_ref)</text>
  </g>
</svg>
