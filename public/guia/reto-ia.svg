<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sube el contrato de tu reto y la IA detecta la firma, la fase y las reglas">
  <rect width="820" height="320" rx="18" fill="#0e121b"/>
  <rect x="1" y="1" width="818" height="318" rx="18" fill="none" stroke="#232a3d"/>
  <text x="40" y="46" fill="#e8ecf4" font-family="Arial" font-size="18" font-weight="bold">Tu reto, leído por la IA</text>
  <!-- documento -->
  <g transform="translate(60,80)">
    <rect width="150" height="180" rx="10" fill="#151a26" stroke="#2b3350"/>
    <path d="M110 0 h40 v40 z" fill="#0e121b"/>
    <g fill="#2b3350"><rect x="22" y="34" width="90" height="8" rx="4"/><rect x="22" y="54" width="106" height="7" rx="3"/><rect x="22" y="70" width="80" height="7" rx="3"/><rect x="22" y="90" width="106" height="7" rx="3"/><rect x="22" y="106" width="70" height="7" rx="3"/></g>
    <text x="75" y="164" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="12">PDF o foto</text>
  </g>
  <g stroke="#7c8cff" stroke-width="2.5" fill="none"><path d="M222 170 H300" marker-end="url(#ra)"/></g>
  <defs><marker id="ra" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#7c8cff"/></marker></defs>
  <!-- IA -->
  <g transform="translate(316,140)">
    <circle r="30" fill="#161b2e" stroke="#7c8cff" stroke-width="1.5"/>
    <path d="M0 -16 l6 12 h12 l-10 8 l4 13 l-12 -8 l-12 8 l4 -13 l-10 -8 h12 z" fill="#7c8cff"/>
    <text x="0" y="52" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="12">Onyx AI lee</text>
  </g>
  <!-- resultado -->
  <g transform="translate(420,80)">
    <rect width="340" height="180" rx="12" fill="#151a26" stroke="#2b3350"/>
    <g font-family="Arial" font-size="13">
      <text x="22" y="42" fill="#8b93a7">Firma</text><text x="318" y="42" text-anchor="end" fill="#e8ecf4" font-weight="bold">FTMO</text>
      <text x="22" y="78" fill="#8b93a7">Fase</text>
      <rect x="250" y="62" width="68" height="22" rx="11" fill="#2a2350"/><text x="284" y="78" text-anchor="middle" fill="#b3a9ff" font-size="12">Fase 1</text>
      <text x="22" y="114" fill="#8b93a7">Objetivo</text><text x="318" y="114" text-anchor="end" fill="#34e2a0" font-weight="bold">+10%</text>
      <text x="22" y="150" fill="#8b93a7">Pérdida diaria máx.</text><text x="318" y="150" text-anchor="end" fill="#e24b4a" font-weight="bold">5%</text>
    </g>
  </g>
</svg>
