<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="El alumno paga, Stripe procesa, y el dinero llega a tu cuenta de Stripe menos la comisión de Onyx">
  <rect width="820" height="300" rx="18" fill="#0e121b"/>
  <rect x="1" y="1" width="818" height="298" rx="18" fill="none" stroke="#232a3d"/>
  <text x="40" y="46" fill="#e8ecf4" font-family="Arial" font-size="18" font-weight="bold">Cómo cobran los mentores</text>
  <text x="40" y="70" fill="#8b93a7" font-family="Arial" font-size="13">El dinero de tus alumnos entra en TU cuenta de Stripe. Onyx solo retiene su comisión.</text>

  <!-- Alumno -->
  <g transform="translate(40,110)">
    <rect width="180" height="150" rx="12" fill="#151a26" stroke="#2b3350"/>
    <circle cx="90" cy="52" r="26" fill="#2a2350"/><text x="90" y="60" text-anchor="middle" font-size="26">👩‍🎓</text>
    <text x="90" y="102" text-anchor="middle" fill="#c9d0e6" font-family="Arial" font-size="14" font-weight="bold">Alumno paga</text>
    <rect x="40" y="118" width="100" height="18" rx="9" fill="#1b2233"/><text x="90" y="131" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="11">tarjeta · USD</text>
  </g>
  <!-- flecha alumno → stripe -->
  <g><path d="M226 185 L268 185" stroke="#7c8cff" stroke-width="3"/><path d="M268 179 L280 185 L268 191 Z" fill="#7c8cff"/></g>

  <!-- Stripe / Onyx plataforma -->
  <g transform="translate(288,110)">
    <rect width="200" height="150" rx="12" fill="#151a26" stroke="#7c8cff"/>
    <text x="100" y="44" text-anchor="middle" fill="#c9d0e6" font-family="Arial" font-size="14" font-weight="bold">Stripe (Onyx)</text>
    <rect x="24" y="60" width="152" height="26" rx="6" fill="#1b2233"/><text x="100" y="78" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="12">procesa el cobro</text>
    <rect x="24" y="94" width="152" height="26" rx="6" fill="#241d10"/><text x="100" y="112" text-anchor="middle" fill="#e0a83a" font-family="Arial" font-size="12">separa comisión Onyx</text>
    <text x="100" y="140" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="11">destination charge</text>
  </g>
  <g><path d="M496 185 L538 185" stroke="#1d9e75" stroke-width="3"/><path d="M538 179 L550 185 L538 191 Z" fill="#1d9e75"/></g>

  <!-- Mentor -->
  <g transform="translate(558,110)">
    <rect width="220" height="150" rx="12" fill="#151a26" stroke="#1d9e75"/>
    <circle cx="44" cy="46" r="22" fill="#12331f"/><text x="44" y="54" text-anchor="middle" font-size="22">🧑‍🏫</text>
    <text x="80" y="42" fill="#c9d0e6" font-family="Arial" font-size="14" font-weight="bold">Tu Stripe</text>
    <text x="80" y="62" fill="#34e2a0" font-family="Arial" font-size="12">recibe el neto</text>
    <rect x="24" y="86" width="172" height="18" rx="9" fill="#12331f"/><text x="110" y="99" text-anchor="middle" fill="#34e2a0" font-family="Arial" font-size="11">venta − comisiones</text>
    <text x="24" y="132" fill="#8b93a7" font-family="Arial" font-size="11">Stripe paga a tu banco</text>
  </g>
</svg>
