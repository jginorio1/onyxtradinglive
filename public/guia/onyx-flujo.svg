<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tu plataforma envía las operaciones a Onyx y tú las ves en el panel">
  <rect width="820" height="340" rx="18" fill="#0e121b"/>
  <rect x="1" y="1" width="818" height="338" rx="18" fill="none" stroke="#232a3d"/>
  <!-- Plataforma -->
  <g>
    <rect x="48" y="110" width="180" height="120" rx="14" fill="#151a26" stroke="#2b3350"/>
    <rect x="70" y="134" width="136" height="12" rx="6" fill="#2b3350"/>
    <rect x="70" y="156" width="100" height="10" rx="5" fill="#222a3e"/>
    <rect x="70" y="174" width="120" height="10" rx="5" fill="#222a3e"/>
    <rect x="70" y="196" width="72" height="18" rx="6" fill="#1d9e75"/>
    <text x="138" y="96" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="15">Tu MetaTrader / cTrader</text>
    <text x="138" y="256" text-anchor="middle" fill="#6f7891" font-family="Arial" font-size="12.5">El EA lee tus operaciones</text>
  </g>
  <!-- flecha -->
  <g stroke="#7c8cff" stroke-width="2.5" fill="none">
    <path d="M236 170 H322" marker-end="url(#a)"/>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#7c8cff"/></marker>
  <marker id="b" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#34e2a0"/></marker></defs>
  <text x="279" y="150" text-anchor="middle" fill="#7c8cff" font-family="Arial" font-size="12">envía</text>
  <!-- Nube Onyx -->
  <g>
    <circle cx="410" cy="170" r="62" fill="#161b2e" stroke="#7c8cff" stroke-width="1.5"/>
    <path d="M410 140 l7 20 h21 l-17 13 l7 21 l-18 -13 l-18 13 l7 -21 l-17 -13 h21 z" fill="#7c8cff"/>
    <text x="410" y="252" text-anchor="middle" fill="#c9d0e6" font-family="Arial" font-size="14">Onyx (la nube)</text>
    <text x="410" y="272" text-anchor="middle" fill="#6f7891" font-family="Arial" font-size="12">calcula tus números</text>
  </g>
  <g stroke="#34e2a0" stroke-width="2.5" fill="none"><path d="M498 170 H584" marker-end="url(#b)"/></g>
  <text x="541" y="150" text-anchor="middle" fill="#34e2a0" font-family="Arial" font-size="12">muestra</text>
  <!-- Panel -->
  <g>
    <rect x="592" y="104" width="180" height="132" rx="14" fill="#151a26" stroke="#2b3350"/>
    <circle cx="628" cy="150" r="22" fill="none" stroke="#34e2a0" stroke-width="6"/>
    <text x="628" y="155" text-anchor="middle" fill="#e8ecf4" font-family="Arial" font-size="13" font-weight="bold">72%</text>
    <rect x="664" y="134" width="86" height="10" rx="5" fill="#2b3350"/>
    <rect x="664" y="152" width="66" height="10" rx="5" fill="#222a3e"/>
    <rect x="612" y="188" width="30" height="26" rx="4" fill="#1d9e75"/>
    <rect x="648" y="188" width="30" height="26" rx="4" fill="#ffc04d"/>
    <rect x="684" y="188" width="30" height="26" rx="4" fill="#1d9e75"/>
    <rect x="720" y="188" width="30" height="26" rx="4" fill="#e24b4a"/>
    <text x="682" y="90" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="15">Tu panel de Onyx</text>
  </g>
  <text x="410" y="44" text-anchor="middle" fill="#e8ecf4" font-family="Arial" font-size="18" font-weight="bold">Onyx nunca entra en tu cuenta</text>
  <text x="410" y="68" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="13.5">tú instalas el EA, y él te envía las operaciones · sin tu contraseña</text>
</svg>
