<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Un VPS mantiene tu MetaTrader encendido 24/7 en la nube, aunque apagues tu ordenador">
  <rect width="820" height="320" rx="18" fill="#0e121b"/>
  <rect x="1" y="1" width="818" height="318" rx="18" fill="none" stroke="#232a3d"/>
  <text x="410" y="46" text-anchor="middle" fill="#e8ecf4" font-family="Arial" font-size="18" font-weight="bold">Un VPS: tu MetaTrader encendido 24/7</text>
  <!-- tu ordenador apagado -->
  <g transform="translate(60,96)">
    <rect width="180" height="120" rx="12" fill="#151a26" stroke="#2b3350"/>
    <rect x="24" y="20" width="132" height="70" rx="6" fill="#0e121b" stroke="#2b3350"/>
    <line x1="50" y1="40" x2="130" y2="80" stroke="#e24b4a" stroke-width="3"/><line x1="130" y1="40" x2="50" y2="80" stroke="#e24b4a" stroke-width="3"/>
    <rect x="70" y="94" width="40" height="8" rx="3" fill="#2b3350"/>
    <text x="90" y="140" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="12.5">Tu ordenador</text>
    <text x="90" y="158" text-anchor="middle" fill="#e24b4a" font-family="Arial" font-size="12">apagado ✓ sin problema</text>
  </g>
  <g stroke="#7c8cff" stroke-width="2.5" stroke-dasharray="6 5" fill="none"><path d="M250 150 H320" marker-end="url(#v1)"/></g>
  <defs><marker id="v1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#7c8cff"/></marker>
  <marker id="v2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#34e2a0"/></marker></defs>
  <!-- VPS en la nube -->
  <g transform="translate(330,86)">
    <rect width="160" height="150" rx="14" fill="#161b2e" stroke="#7c8cff" stroke-width="1.5"/>
    <g transform="translate(30,24)">
      <rect width="100" height="16" rx="4" fill="#1b2540"/><circle cx="12" cy="8" r="4" fill="#34e2a0"/>
      <rect y="24" width="100" height="16" rx="4" fill="#1b2540"/><circle cx="12" cy="32" r="4" fill="#34e2a0"/>
      <rect y="48" width="100" height="16" rx="4" fill="#1b2540"/><circle cx="12" cy="56" r="4" fill="#34e2a0"/>
    </g>
    <text x="80" y="120" text-anchor="middle" fill="#c9d0e6" font-family="Arial" font-size="13" font-weight="bold">VPS en la nube</text>
    <text x="80" y="138" text-anchor="middle" fill="#34e2a0" font-family="Arial" font-size="11">siempre encendido</text>
  </g>
  <g stroke="#34e2a0" stroke-width="2.5" fill="none"><path d="M500 150 H570" marker-end="url(#v2)"/></g>
  <!-- Onyx recibe -->
  <g transform="translate(590,96)">
    <rect width="170" height="120" rx="12" fill="#151a26" stroke="#1d9e75"/>
    <path d="M85 24 l7 14 h15 l-12 10 l5 16 l-15 -10 l-15 10 l5 -16 l-12 -10 h15 z" fill="#7c8cff"/>
    <circle cx="120" cy="70" r="6" fill="#34e2a0"/>
    <text x="85" y="94" text-anchor="middle" fill="#34e2a0" font-family="Arial" font-size="12.5" font-weight="bold">Onyx recibe 24/7</text>
    <text x="85" y="110" text-anchor="middle" fill="#8b93a7" font-family="Arial" font-size="11">EA, copy y Guardian activos</text>
  </g>
</svg>
